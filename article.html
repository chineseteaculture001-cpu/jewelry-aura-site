<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Article | Luminous Aura</title>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M9YWY740XN"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-M9YWY740XN');
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --deep-sea: #000c18;
            --gold: #c5a059;
            --seal-red: #a31f34;
            --silk: #f4f1ea;
            --font-main: 'Montserrat', sans-serif;
            --font-title: 'Playfair Display', serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--deep-sea); color: var(--silk); font-family: var(--font-main); line-height: 2; overflow-x: hidden; }

        header {
            padding: 25px 8%; display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 12, 24, 0.9); backdrop-filter: blur(20px);
            position: sticky; top: 0; z-index: 2000; border-bottom: 1px solid rgba(197, 160, 89, 0.2);
        }
        .brand-logo { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .brand-logo .seal {
            width: 50px; height: 50px; background: var(--seal-red); color: white;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-title); font-weight: 700; font-size: 0.9rem;
            text-transform: uppercase;
        }
        .brand-logo h1 { font-family: var(--font-title); font-size: 1.3rem; color: var(--silk); text-transform: uppercase; letter-spacing: 3px; font-weight: 400; }

        .article-container { max-width: 900px; margin: 100px auto; padding: 0 8%; }
        .date { font-size: 0.9rem; text-transform: uppercase; color: var(--gold); margin-bottom: 20px; display: block; letter-spacing: 3px; font-weight: 600; text-align: center;}
        h1 { font-family: var(--font-title); color: var(--gold); margin-bottom: 60px; letter-spacing: 2px; font-weight: 400; font-size: 3rem; text-align: center; line-height: 1.2; }
        
        .content { color: rgba(244, 241, 234, 0.8); font-size: 1.15rem; font-weight: 300; }
        .content h2 { font-family: var(--font-title); color: var(--gold); margin: 60px 0 30px; font-weight: 400; font-size: 2.2rem; }
        .content p { margin-bottom: 30px; }
        .content img { width: 100%; border: 1px solid rgba(197, 160, 89, 0.3); margin: 40px 0; }
        .content strong { color: #fff; font-weight: 600; }

        .back-link { margin-bottom: 60px; text-align: center; }
        .back-link a { color: var(--gold); text-decoration: none; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        footer { background: #000810; color: var(--silk); padding: 120px 8% 40px; border-top: 1px solid rgba(197, 160, 89, 0.1); margin-top: 100px; }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="brand-logo">
            <div class="seal">Aura</div>
            <h1>Luminous Aura</h1>
        </a>
    </header>

    <div class="article-container">
        <div class="back-link"><a href="journal.html">← Back to Journal</a></div>
        <span class="date" id="post-date">...</span>
        <h1 id="post-title">Loading Article</h1>
        <div id="content" class="content">
            <!-- Rendered Markdown -->
        </div>
    </div>

    <footer>
        <div style="text-align: center; color: rgba(244, 241, 234, 0.5); font-size: 0.8rem; letter-spacing: 1px;">
            &copy; 2026 Luminous Aura. All Rights Reserved.
            <a href="privacy.html" style="color: var(--gold);">Privacy Policy</a> | <a href="terms.html" style="color: var(--gold);">Terms &amp; Conditions</a>
        </div>
    </footer>

    <script>
        async function loadPost() {
            const params = new URLSearchParams(window.location.search);
            const index = params.get('id');
            if (index === null) { window.location.href = 'journal.html'; return; }

            try {
                const res = await fetch('content/journal.json');
                const d = await res.json();
                const post = d.posts[index];
                
                if (post) {
                    document.getElementById('post-title').innerText = post.title;
                    document.getElementById('post-date').innerText = post.date;
                    document.getElementById('content').innerHTML = marked.parse(post.content);
                    document.title = `${post.title} | Luminous Aura`;
                }
            } catch (e) {
                console.error(e);
            }
        }
        loadPost();
    </script>
</body>
</html>
